name: Content quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -B -m unittest discover -s pipeline -p 'test_*.py'
      - run: npm run content:validate
      - run: python pipeline/validate.py
      - run: npm run typecheck
      - run: npm run build
