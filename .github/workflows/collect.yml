name: Collect and organize interview sources

on:
  schedule:
    # GitHub Actions cron 使用 UTC；13:00 UTC = 北京时间 21:00。
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      MAX_ENRICH_ITEMS: ${{ vars.MAX_ENRICH_ITEMS || '10' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Discover public sources
        run: python pipeline/collect.py

      - name: Structure candidates with DeepSeek
        run: python pipeline/deepseek.py

      - name: Find possible duplicates
        run: python pipeline/deduplicate.py

      - name: Validate formal content
        run: python pipeline/validate.py

      - name: Open or refresh content review PR
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- content/inbox)" ]; then
            echo "No content changes."
            exit 0
          fi

          branch="automation/content-update"
          git config user.name "embedded-interview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add content/inbox
          git commit -m "content: refresh interview source inbox"
          git push --force-with-lease origin "HEAD:$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "content: 每日面经候选更新" --body "自动发现并整理的公开面经候选。请检查来源、重复项和 AI 草稿后再并入正式题库。"
          else
            gh pr create --base main --head "$branch" --title "content: 每日面经候选更新" --body "自动发现并整理的公开面经候选。请检查来源、重复项和 AI 草稿后再并入正式题库。"
          fi
