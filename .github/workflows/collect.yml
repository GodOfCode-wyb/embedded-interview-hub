name: Collect and organize interview sources

on:
  schedule:
    # GitHub Actions cron 使用 UTC；13:00 UTC = 北京时间 21:00。
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      MAX_ENRICH_ITEMS: ${{ vars.MAX_ENRICH_ITEMS || '30' }}
      MAX_STAGE_QUESTIONS: ${{ vars.MAX_STAGE_QUESTIONS || '40' }}
      PAGE_FETCH_DELAY_SECONDS: ${{ vars.PAGE_FETCH_DELAY_SECONDS || '0.8' }}
      REENRICH_AFTER_DAYS: ${{ vars.REENRICH_AFTER_DAYS || '30' }}
      MAX_LINK_SEED_PAGES: ${{ vars.MAX_LINK_SEED_PAGES || '40' }}
      MAX_LINKS_PER_SEED: ${{ vars.MAX_LINKS_PER_SEED || '20' }}
      MAX_LINK_DISCOVERIES: ${{ vars.MAX_LINK_DISCOVERIES || '300' }}
      LINK_RESCAN_AFTER_DAYS: ${{ vars.LINK_RESCAN_AFTER_DAYS || '30' }}
      LINK_REQUEST_DELAY_SECONDS: ${{ vars.LINK_REQUEST_DELAY_SECONDS || '1.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Test collection policies
        run: python -B -m unittest discover -s pipeline -p 'test_*.py'

      - name: Discover public sources
        run: python pipeline/collect.py

      - name: Expand related public links
        run: python pipeline/discover.py

      - name: Structure candidates with DeepSeek
        run: python pipeline/deepseek.py

      - name: Find possible duplicates
        run: python pipeline/deduplicate.py

      - name: Stage reviewable AI drafts
        run: python pipeline/promote.py

      - name: Build public search index
        run: python pipeline/build_index.py

      - name: Validate formal content
        run: |
          python pipeline/validate.py
          npm run content:validate
          npm run typecheck
          npm run build

      - name: Open or refresh content review PR
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- content public/data/catalog.json)" ]; then
            echo "No content changes."
            exit 0
          fi

          branch="automation/content-update"
          git config user.name "embedded-interview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add content public/data/catalog.json
          git commit -m "content: refresh interview review queue"
          git push --force-with-lease origin "HEAD:$branch"

          pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          pr_title="content: 每日面经与候选题更新"
          pr_body="通过免费公开搜索、公共代码索引、技术问答和合规关联链接发现面经与八股资料，并对明确出现的问题生成 AI 答案草稿。请在 Files changed 中重点检查 content/questions.json、content/sources.json 和 content/inbox/review.json；合并 PR 即表示人工审核通过。"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
          else
            gh pr create --base main --head "$branch" --title "$pr_title" --body "$pr_body"
          fi
